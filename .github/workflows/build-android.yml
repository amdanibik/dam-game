name: Build Android APK and AAB

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build APK and AAB
    runs-on: ubuntu-latest

    steps:
    - name: 📥 Checkout Repository
      uses: actions/checkout@v4

    - name: 🟢 Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: 'npm'

    - name: ☕ Setup Java JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'
        cache: 'gradle'

    - name: 🤖 Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: 📦 Install Node Dependencies
      run: npm install

    - name: 🔄 Sync Web Assets to Android
      run: |
        npm run build
        npx cap sync android

    - name: 🔑 Generate Release Keystore (for signing)
      run: |
        cd android/app
        keytool -genkeypair -v \
          -keystore daman-release.jks \
          -alias daman-key \
          -keyalg RSA \
          -keysize 2048 \
          -validity 10000 \
          -storepass daman123 \
          -keypass daman123 \
          -dname "CN=Muhammad Amdanibik, OU=Game, O=Evo Corp, L=Kediri, ST=East Java, C=ID"

    - name: ⚙️ Configure Gradle Release Signing
      run: |
        # Injeksi konfigurasi signing release ke android/app/build.gradle
        python3 -c "
        path = 'android/app/build.gradle'
        with open(path, 'r') as f:
            content = f.read()
        signing_block = '''
        signingConfigs {
            release {
                storeFile file('daman-release.jks')
                storePassword 'daman123'
                keyAlias 'daman-key'
                keyPassword 'daman123'
            }
        }
        '''
        content = content.replace('android {', 'android {\n' + signing_block, 1)
        content = content.replace('buildTypes {\n        release {', 'buildTypes {\n        release {\n            signingConfig signingConfigs.release', 1)
        with open(path, 'w') as f:
            f.write(content)
        "

    - name: 🛠️ Make Gradle wrapper executable
      run: chmod +x android/gradlew

    - name: 🔨 Build Debug & Release APK
      run: |
        cd android
        ./gradlew assembleDebug assembleRelease

    - name: 📦 Build Release AAB (Google Play Bundle)
      run: |
        cd android
        ./gradlew bundleRelease

    - name: 📤 Upload Debug APK Artifact (Bisa langsung diinstall di HP)
      uses: actions/upload-artifact@v4
      with:
        name: Game-Daman-APK
        path: android/app/build/outputs/apk/debug/app-debug.apk

    - name: 📤 Upload Signed Release AAB Artifact (Siap diupload ke Play Store)
      uses: actions/upload-artifact@v4
      with:
        name: Game-Daman-AAB
        path: android/app/build/outputs/bundle/release/*.aab

